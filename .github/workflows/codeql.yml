# CodeQL static analysis for the C++ core and the web console.
# Findings policy: every alert is either fixed or explicitly documented as
# a false positive — never silenced without a written reason (ROADMAP item 4).
name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC

jobs:
  analyze-cpp:
    name: Analyze (cpp)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Install toolchain
        run: |
          pacman -Syu --noconfirm --needed git cmake ninja gcc openmp gmp gtest
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: cpp
      - name: Build C++ core
        # The arch toolchain is the same one the CI lane builds with; the
        # ubuntu runner's default GCC cannot compile C++26, which breaks
        # CMake's OpenMP try-compile before CodeQL sees any code.
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:cpp"

  analyze-web:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
